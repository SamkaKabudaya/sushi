<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Оплата · Суші Мінімал</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#14213d;--muted:#5c6b82;--line:#d9e1ec;--accent:#4aa3df;--tg:#2aabee;--wa:#25d366}
@media (prefers-color-scheme:dark){:root{--bg:#0f1622;--card:#182233;--text:#e8eef7;--muted:#97a6bd;--line:#2a3850}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:24px 16px 40px}
h1{margin:0 0 4px;font-size:24px}
.sub{margin:0 0 20px;color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);font:inherit;font-size:18px}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.hint{margin-top:5px;font-size:12px;color:var(--muted)}
.go{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border:0;border-radius:12px;font:600 17px system-ui,sans-serif;color:#fff;text-decoration:none;cursor:pointer}
.btn.tg{background:var(--tg)} .btn.wa{background:var(--wa)}
.btn.copy{width:100%;background:transparent;color:var(--text);border:1px solid var(--line);font-size:15px}
.btn[aria-disabled=true]{opacity:.35;pointer-events:none}
pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.5 system-ui,sans-serif}
.err{color:#d64545;font-size:13px;margin-top:6px;min-height:1em}
</style></head>
<body><main>
<h1>🍣 Посилання на оплату</h1>
<p class="sub">Сума і контакт → кнопка відкриє чат з клієнтом з готовим повідомленням. Лишається натиснути «Надіслати».</p>

<div class="card">
  <div class="row">
    <div class="field"><label for="sum">Сума, грн</label><input id="sum" inputmode="decimal" placeholder="2235" autocomplete="off"></div>
    <div class="field"><label for="order">№ замовлення</label><input id="order" placeholder="необов'язково" autocomplete="off"></div>
  </div>
  <div class="field">
    <label for="who">Телефон або @username клієнта</label>
    <input id="who" placeholder="+380 67 123 45 67 або @ivan" autocomplete="off">
    <div class="hint">WhatsApp — лише за номером. Telegram — за @username; без нього відкриється вибір чату.</div>
    <div class="err" id="err"></div>
  </div>
</div>

<div class="go">
  <a class="btn tg" id="tg" target="_blank" rel="noopener" aria-disabled="true">Telegram</a>
  <a class="btn wa" id="wa" target="_blank" rel="noopener" aria-disabled="true">WhatsApp</a>
</div>
<button class="btn copy" id="copy" aria-disabled="true">📋 Скопіювати повідомлення</button>

<div class="card" style="margin-top:14px"><label>Повідомлення клієнту</label><pre id="msg">—</pre></div>

<script>
// Сторінка оплати — GitHub Pages (репозиторій SamkaKabudaya/sushi); локально (file://) — pay.html поруч
const PAY_PAGE = location.protocol === "file:" ? new URL("pay.html", location.href).href : "https://samkakabudaya.github.io/sushi/pay";

const $ = id => document.getElementById(id);

function payLink(sum, order) {  // коротке: pay.html?2235-57; реквізити і посилання НБУ збирає сама сторінка
  return PAY_PAGE + "?" + sum + (order ? "-" + order : "");
}

function contact(raw) {  // → {phone: "380671234567"} | {user: "ivan"} | {} (порожньо) | null (не схоже ні на що)
  const s = raw.trim();
  if (!s) return {};
  const user = s.replace(/^@|^https?:\/\/t\.me\//i, "");
  if (/^[a-z][a-z0-9_]{3,31}$/i.test(user)) return {user};
  let d = s.replace(/\D/g, "");
  if (d.length === 10 && d[0] === "0") d = "38" + d;  // 067… → 38067…
  if (d.length === 9) d = "380" + d;                  // 67… → 38067…
  return /^380\d{9}$/.test(d) ? {phone: d} : null;
}

function update() {
  const sum = Number($("sum").value.replace(",", ".").replace(/\s/g, ""));
  const order = $("order").value.trim().replace(/[^\w-]/g, "").slice(0, 20);  // у посиланні — лише літери, цифри, «-»
  const who = contact($("who").value);
  const okSum = sum > 0 && sum < 1e6 && /^\d+(\.\d{1,2})?$/.test(String(sum));
  $("err").textContent = who === null ? "Не схоже на номер (+380…) чи @username" : "";
  if (!okSum) {
    $("msg").textContent = "—";
    ["tg", "wa", "copy"].forEach(id => $(id).setAttribute("aria-disabled", "true"));
    return;
  }
  const link = payLink(sum, order);
  const text = `Доброго дня! 🍣\nДо сплати ${sum.toLocaleString("uk-UA")} грн${order ? ` (замовлення №${order})` : ""}.\n\n` +
    `Оплатити в один дотик (реквізити і сума вже заповнені):\n${link}\n\nДякуємо! 🩵`;
  $("msg").textContent = text;
  const enc = encodeURIComponent(text);
  const tg = who && who.user ? `https://t.me/${who.user}?text=${enc}`
    : who && who.phone ? `https://t.me/+${who.phone}?text=${enc}`
    : `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(text.replace(link, "").trim())}`;
  $("tg").href = tg;
  $("tg").setAttribute("aria-disabled", who === null ? "true" : "false");
  // не wa.me: його переадресація псує емодзі на «�» (видно 02.11) — одразу api.whatsapp.com
  $("wa").href = `https://api.whatsapp.com/send?${who && who.phone ? `phone=${who.phone}&` : ""}text=${enc}`;
  $("wa").setAttribute("aria-disabled", who === null || (who && who.user) ? "true" : "false");
  $("copy").setAttribute("aria-disabled", "false");
}

["sum", "order", "who"].forEach(id => $(id).addEventListener("input", update));
$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("msg").textContent); $("copy").textContent = "✅ Скопійовано"; }
  catch { $("copy").textContent = "Виділіть текст нижче і скопіюйте"; }
  setTimeout(() => $("copy").textContent = "📋 Скопіювати повідомлення", 1800);
});
window.payLink = payLink; window.contact = contact;  // для самоперевірки в консолі
</script>
</main></body></html>
